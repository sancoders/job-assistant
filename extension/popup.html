<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { width: 450px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 14px; color: #1a1a1a; background: #fff; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  label { font-size: 12px; font-weight: 600; color: #444; display: block; margin: 8px 0 4px; }
  button { color: #fff; border: 0; padding: 10px 16px; border-radius: 7px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 8px; }
  #btnScore { flex: 1; background: #5b3fb0; }
  #btnApply { flex: 1; background: #0a66c2; }
  .copy { background: #0a7d33; margin-top: 6px; padding: 6px 12px; font-size: 12px; }
  #status { font-size: 13px; color: #555; margin: 10px 0; }
  .meta { font-size: 13px; background: #f4f6f8; border-radius: 7px; padding: 8px 10px; margin: 8px 0; line-height: 1.5; }
  .badge { display: inline-block; background: #0a66c2; color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 12px; }
  .badge.fit { background: #5b3fb0; }
  textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12px; padding: 8px; border: 1px solid #ccc; border-radius: 7px; resize: vertical; }
  #questions { height: 64px; }
  #letter { height: 200px; }
  .reasons { font-size: 12px; color: #333; margin: 6px 0; line-height: 1.5; }
  .hidden { display: none; }
  .err { color: #c0392b; }
  .section { border: 1px solid #e3e7eb; border-radius: 9px; padding: 10px; margin: 12px 0; }
  .sec-title { font-size: 13px; font-weight: 700; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .qa { background: #f4f6f8; border-radius: 7px; padding: 8px 10px; margin: 8px 0; }
  .qa .q { font-weight: 600; font-size: 12px; margin-bottom: 3px; }
  .qa .a { font-size: 12px; white-space: pre-wrap; }
  .hint { font-size: 11px; color: #888; margin: 2px 0 0; }
</style>
</head>
<body>
  <h2>📝 Job Assistant</h2>

  <label for="questions">Preguntas de la aplicación (una por línea — solo para Aplicar)</label>
  <textarea id="questions" placeholder="¿Cuántos años de experiencia con n8n?&#10;¿Expectativa salarial?&#10;¿Disponible en zona horaria US?"></textarea>

  <div class="btns">
    <button id="btnScore" title="Rápido: solo score y razones, se guarda en la base">🎯 Ver Score</button>
    <button id="btnApply" title="Genera cover letter + respuestas a las preguntas">✉️ Aplicar</button>
  </div>
  <p class="hint">Score = evaluar rápido y guardar. Aplicar = generar cover letter + respuestas.</p>
  <div id="status"></div>

  <div id="result" class="hidden">
    <div class="meta" id="meta"></div>

    <div id="reasonsWrap" class="hidden">
      <div class="reasons" id="reasons"></div>
    </div>

    <div id="coverWrap" class="section hidden">
      <div class="sec-title">
        <span>✉️ Cover letter</span>
        <button class="copy" id="copyLetter">📋 Copiar</button>
      </div>
      <textarea id="letter" readonly></textarea>
    </div>

    <div id="answersWrap" class="section hidden">
      <div class="sec-title">
        <span>❓ Respuestas</span>
        <button class="copy" id="copyAllAnswers">📋 Copiar todas</button>
      </div>
      <div id="answers"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
